name: msgs
description: "Messages - an on-device SMS app in Material 3 Expressive."
publish_to: 'none' 
version: 1.2.0+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  isar_community: ^3.3.2
  path_provider: ^2.1.5
  animations: ^2.2.0
  cached_network_image: ^3.4.1
  get_it: ^9.2.1
  permission_handler: ^12.0.1
  package_info_plus: ^10.1.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  isar_community_flutter_libs: ^3.3.2
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  material_ui: ^1.11.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true

  assets:
    - licenses/OFL-1.1.txt
    - licenses/LICENSE-MIT-material-clock.txt

  fonts:
    # Google Sans Flex, variable (wght 1-1000, opsz 6-144). SIL OFL 1.1, see licenses/OFL-1.1.txt.
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/google_sans_flex.ttf
